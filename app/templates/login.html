<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل دخول موظف KAALEX</title>
  </head>
  <body>
    <main>
      <h1>تسجيل دخول الموظف</h1>
      <form id="login-form">
        <label>اسم المستخدم <input id="username" name="username" autocomplete="username" required></label>
        <label>كلمة المرور <input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">دخول</button>
      </form>
      <p id="login-error" role="alert" hidden></p>
    </main>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json", "Origin": window.location.origin},
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        const error = document.getElementById("login-error");
        if (!response.ok) {
          error.textContent = "تعذر تسجيل الدخول. تحقق من بيانات الدخول وحاول مرة أخرى.";
          error.hidden = false;
        }
      });
    </script>
  </body>
</html>
