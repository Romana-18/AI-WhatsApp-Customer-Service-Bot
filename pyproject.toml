[project]
name = "kaalex-whatsapp-customer-service-bot"
version = "0.1.0"
description = "KAALEX WhatsApp customer service bot"
requires-python = "==3.12.14"
dependencies = [
    "alembic==1.19.2",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: opt-in tests that call real external providers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
